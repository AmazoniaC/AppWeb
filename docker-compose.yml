# PostgreSQL local para desarrollo: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: amazonia
      POSTGRES_PASSWORD: amazonia
      POSTGRES_DB: amazonia_erp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
